services:
  # Backend API Service
  - type: web
    name: aqi-backend
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        fromGroup: web
    autoDeploy: true

  # Frontend Service
  - type: web
    name: aqi-frontend
    runtime: static
    region: oregon
    plan: starter
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: VITE_API_BASE_URL
        sync: false
    autoDeploy: true
